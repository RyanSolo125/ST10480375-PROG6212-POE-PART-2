name: RaceDay - Build and Test

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Part2-RaceDayApi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore

      # Builds all three projects in the solution: RaceDay.Api, RaceDay.Web (MVC) and RaceDay.Tests
      - name: Build solution (API + MVC + tests)
        run: dotnet build --no-restore --configuration Release

      - name: Build MVC project
        run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Checks that the Dockerfile still builds the MVC app into an image
      - name: Build MVC Docker image
        run: docker build -t raceday-web ./RaceDay.Web
